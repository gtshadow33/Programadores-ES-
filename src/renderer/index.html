
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Hazlo App</title>
</head>

<body class="min-h-screen bg-[#ba4949] font-sans text-white
             flex justify-center
             transition-colors duration-500 pb-8">

    <!-- Overlay -->
    <div id="sidebar-overlay"
        class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity duration-300">
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0
               w-[clamp(240px,22vh,288px)]
               max-w-[85vh]
               bg-white text-slate-800 shadow-xl z-50
               transform -translate-x-full
               transition-transform duration-300 ease-in-out
               flex flex-col">

        <!-- Cabecera -->
        <div class="flex items-center justify-between
                    px-[clamp(12px,1.5vh,16px)]
                    py-[clamp(8px,1vh,12px)]
                    border-b border-slate-200">

            <h2 class="text-[clamp(13px,1.5vh,20px)] font-bold">
                Menu
            </h2>

            <button id="sidebar-close"
                aria-label="Cerrar menú"
                class="text-slate-400 hover:text-slate-700
                       cursor-pointer rounded-md p-1
                       hover:bg-slate-100">

                <svg class="size-[clamp(18px,2vh,24px)]">
                    <use href="./assets/icons.svg#cerrar-menu"></use>
                </svg>
            </button>
        </div>


        <!-- OPCIONES -->
        <nav class="flex-1 overflow-y-auto
                    px-[clamp(6px,1vh,8px)]
                    py-[clamp(8px,1vh,12px)]
                    border-b border-slate-200">

            <ul class="space-y-1">

                <li class="group">

                    <div class="flex items-center justify-between gap-2
                                px-[clamp(10px,1.2vh,12px)]
                                py-[clamp(8px,1vh,10px)]
                                rounded-md cursor-pointer
                                transition-colors
                                text-slate-700
                                hover:bg-slate-100
                                border-l-4 border-transparent">

                        <div class="flex items-start gap-2">

                            <svg class="size-[clamp(18px,2vh,24px)]">
                                <use href="./assets/icons.svg#lista"></use>
                            </svg>

                            <span class="truncate
                                         text-[clamp(12px,1.3vh,16px)]">
                                Exportar
                            </span>

                        </div>

                    </div>

                </li>


                <li class="group">

                    <div class="flex items-center justify-between gap-2
                                px-[clamp(10px,1.2vh,12px)]
                                py-[clamp(8px,1vh,10px)]
                                rounded-md cursor-pointer
                                transition-colors
                                text-slate-700
                                hover:bg-slate-100
                                border-l-4 border-transparent">

                        <div class="flex items-start gap-2">

                            <svg class="size-[clamp(18px,2vh,24px)]">
                                <use href="./assets/icons.svg#config"></use>
                            </svg>

                            <span class="truncate
                                         text-[clamp(12px,1.3vh,16px)]">
                                Configuración
                            </span>

                        </div>

                    </div>

                </li>

            </ul>

        </nav>


        <!-- PROYECTOS -->
        <nav class="flex-1 overflow-y-auto
                    px-[clamp(6px,1vh,8px)]
                    py-[clamp(8px,1vh,12px)]">

            <ul id="project-list" class="space-y-1">
            </ul>

        </nav>


        <!-- NUEVO PROYECTO -->
        <div class="px-[clamp(10px,1.2vh,12px)]
                    py-[clamp(10px,1.2vh,14px)]
                    border-t border-slate-200">

            <button id="new-project-btn"
                class="w-full flex items-center justify-center
                       gap-2
                       bg-[#ba4949] text-white
                       font-semibold
                       py-[clamp(8px,1vh,10px)]
                       rounded-md
                       tracking-wide
                       cursor-pointer
                       hover:bg-[#9e3f3f]
                       transition-colors
                       text-[clamp(12px,1.3vh,16px)]">

                <svg class="size-[clamp(16px,1.8vh,20px)]">
                    <use href="./assets/icons.svg#plus-sign"></use>
                </svg>

                Nuevo proyecto

            </button>

        </div>

    </aside>


    <!-- CONTENIDO -->
    <div class="w-full
                max-w-[clamp(320px,90vh,448px)]
                px-[clamp(10px,2vh,16px)]
                flex flex-col items-center">


        <!-- HEADER -->
        <header class="w-full
                       py-[clamp(6px,1vh,10px)]
                       flex justify-between items-center
                       border-b border-black/10
                       mb-[clamp(12px,2vh,20px)]">

            <div class="flex items-center
                        gap-[clamp(6px,1vh,8px)]">

                <button id="sidebar-open"
                    aria-label="Abrir menú de proyectos"
                    class="text-white/90 hover:text-white
                           cursor-pointer rounded-md p-1
                           hover:bg-white/10">

                    <svg class="size-[clamp(18px,2vh,24px)]">
                        <use href="./assets/icons.svg#menu"></use>
                    </svg>

                </button>


                <div class="flex items-center
                            gap-[clamp(5px,0.8vh,6px)]
                            font-bold
                            text-[clamp(13px,2vh,18px)]
                            tracking-tight">

                    <svg class="size-[clamp(18px,2vh,24px)]">
                        <use href="./assets/icons.svg#logo"></use>
                    </svg>

                    <span>Hazlo</span>

                </div>

            </div>

        </header>


        <!-- TIMER -->
        <main class="w-full
                     min-h-[clamp(150px,40vh,520px)]
                     bg-white/10
                     backdrop-blur-sm
                     rounded-lg

                     py-[clamp(16px,3vh,24px)]
                     px-[clamp(12px,3vh,20px)]

                     flex flex-col items-center
                     gap-[clamp(8px,1.5vh,12px)]

                     border border-white/5
                     shadow-sm
                     relative z-10">


            <!-- TIMER -->
            <div id="timer-box"
                class="font-bold tracking-tight select-all mb-1 font-sans
                       text-[clamp(36px,12vh,96px)]
                       leading-none">

                00:00

            </div>


            <!-- ACTIVIDAD -->
            <div id="active-activity"
                class="font-bold text-center
                       w-full
                       max-w-[clamp(220px,75vh,300px)]
                       text-[clamp(15px,5vh,26px)]"
                hidden>

                Actividad

            </div>


            <!-- PROYECTO -->
            <div id="active-project"
                class="font-bold text-gray-400
                       text-center mb-1
                       w-full
                       max-w-[clamp(220px,75vh,300px)]
                       text-[clamp(12px,4vh,18px)]"
                hidden>

                Proyecto

            </div>


            <!-- INPUT -->
            <div id="activity-details-div"
                class="relative mb-[clamp(12px,3vh,24px)]
                       w-full
                       max-w-[clamp(220px,75vh,300px)]
                       z-30">

                <input id="activity-details"
                    class="w-full
                           bg-white
                           text-slate-700

                           text-[clamp(12px,4vh,18px)]

                           placeholder:text-slate-400

                           border border-slate-200
                           rounded-md px-3 py-2.5

                           transition duration-300 ease

                           focus:outline-none
                           focus:border-slate-400

                           hover:border-slate-300
                           shadow-sm
                           focus:shadow"

                    placeholder="Actividad @Proyecto">


                <!-- SUGERENCIAS -->
                <div id="suggestion-box"
                    class="absolute top-full left-0 right-0
                           bg-white border border-slate-200
                           rounded-md shadow-xl mt-1.5
                           z-[999] hidden
                           max-h-[30vh]
                           overflow-y-auto">

                </div>

            </div>


            <!-- EMPEZAR -->
            <button id="counter"
                class="w-[clamp(150px,40vh,192px)]
                       bg-white text-[#ba4949]

                       font-bold
                       text-[clamp(13px,4vh,20px)]

                       uppercase py-3
                       rounded-md

                       tracking-wider
                       cursor-pointer

                       hover:bg-[#9e5454]
                       hover:text-white mb-1

                       flex items-center justify-center gap-2">

                <svg class="size-[clamp(17px,5vh,24px)]">
                    <use href="./assets/icons.svg#play"></use>
                </svg>

                Empezar

            </button>


            <!-- DETENER -->
            <button id="stop"
                class="w-[clamp(160px,45vh,192px)]
                       bg-white text-[#ba4949]

                       font-bold
                       text-[clamp(13px,4vh,20px)]

                       uppercase py-3
                       rounded-md

                       tracking-wider
                       cursor-pointer

                       hover:bg-[#9e5454]
                       hover:text-white mb-1

                       flex items-center justify-center gap-2"

                hidden>

                <svg class="size-[clamp(17px,5vh,24px)]">
                    <use href="./assets/icons.svg#stop"></use>
                </svg>

                Detener

            </button>

        </main>


        <!-- HISTORIAL -->
        <section class="w-full">

            <div id="history-section"
                class="relative z-0
                       flex flex-col

                       mt-[clamp(6px,1vh,24px)]

                       bg-white shadow-sm

                       border-[clamp(1px,0.2vh,3px)]
                       border-slate-200

                       rounded-lg

                       max-h-[40vh]

                       overflow-y-auto"

                hidden>


                <div class="flex justify-around">
                </div>


                <div class="p-[clamp(8px,2vh,16px)]">

                    <div id="activity-list">
                    </div>

                </div>

            </div>

        </section>

    </div>


    <!-- SCRIPTS -->

    <script type="module" src="./js/renderer.js"></script>
    <script type="module" src="./js/counter.js"></script>
    <script type="module" src="./js/sidebar.js"></script>


    <!-- SCRIPT HISTORIAL -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const activityList =
                document.getElementById("activity-list");

            const historySection =
                document.getElementById("history-section");


            function actualizarHistorial() {

                if (activityList.children.length === 0) {

                    historySection.hidden = true;

                } else {

                    historySection.hidden = false;

                }

            }


            actualizarHistorial();


            const observer =
                new MutationObserver(() => {

                    actualizarHistorial();

                });


            observer.observe(activityList, {

                childList: true,
                subtree: true

            });

        });

    </script>

</body>

</html>
