
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Hazlo App</title>
</head>

<body class="min-h-screen bg-[#ba4949] font-sans text-white
             flex justify-center
             transition-colors duration-500 pb-8">

    <!-- Overlay -->
    <div id="sidebar-overlay"
        class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity duration-300">
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0
               w-[clamp(240px,22vh,288px)]
               max-w-[85vh]
               bg-white text-slate-800 shadow-xl z-50
               transform -translate-x-full
               transition-transform duration-300 ease-in-out
               flex flex-col">

        <div class="flex items-center justify-between px-4 py-2 border-b border-slate-200">
            <h2 class="text-lg font-bold text-slate-800">Menu</h2>
            <button id="sidebar-close"
                aria-label="Cerrar menú"
                class="text-slate-400 hover:text-slate-700
                       cursor-pointer rounded-md p-1
                       hover:bg-slate-100">

                <svg class="size-[clamp(18px,2vh,24px)]">
                    <use href="./assets/icons.svg#cerrar-menu"></use>
                </svg>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto px-2 py-3 border-b border-slate-200 ">
            <ul class="space-y-1">
                <!--  AÑADIDO id="export-menu-item" -->
                <li id="export-menu-item" class="group">
                    <div class="flex items-center justify-between gap-2 px-3 py-2.5 rounded-md cursor-pointer transition-colors text-slate-700 hover:bg-slate-100 border-l-4 border-transparent">
                        <div class="flex items-start gap-2">

                            <svg class="size-[clamp(18px,2vh,24px)]">
                                <use href="./assets/icons.svg#lista"></use>
                            </svg>

                            <span class="truncate
                                         text-[clamp(12px,1.3vh,16px)]">
                                Exportar
                            </span>

                        </div>
                        <button type="button" class="shrink-0 rounded-md p-1 text-slate-400 hover:text-[#ba4949] hover:bg-white cursor-pointer transition-opacity opacity-100">
                        </button>
                    </div>

                </li>


                <li class="group">

                    <div class="flex items-center justify-between gap-2
                                px-[clamp(10px,1.2vh,12px)]
                                py-[clamp(8px,1vh,10px)]
                                rounded-md cursor-pointer
                                transition-colors
                                text-slate-700
                                hover:bg-slate-100
                                border-l-4 border-transparent">

                        <div class="flex items-start gap-2">

                            <svg class="size-[clamp(18px,2vh,24px)]">
                                <use href="./assets/icons.svg#config"></use>
                            </svg>

                            <span class="truncate
                                         text-[clamp(12px,1.3vh,16px)]">
                                Configuración
                            </span>

                        </div>
                        <button type="button" class="shrink-0 rounded-md p-1 text-slate-400 hover:text-[#ba4949] hover:bg-white cursor-pointer transition-opacity opacity-100">
                        </button>
                    </div>

                </li>

            </ul>

        </nav>


        <!-- PROYECTOS -->
        <nav class="flex-1 overflow-y-auto
                    px-[clamp(6px,1vh,8px)]
                    py-[clamp(8px,1vh,12px)]">

            <ul id="project-list" class="space-y-1">
            </ul>

        </nav>


        <!-- NUEVO PROYECTO -->
        <div class="px-[clamp(10px,1.2vh,12px)]
                    py-[clamp(10px,1.2vh,14px)]
                    border-t border-slate-200">

            <button id="new-project-btn"
                class="w-full flex items-center justify-center
                       gap-2
                       bg-[#ba4949] text-white
                       font-semibold
                       py-[clamp(8px,1vh,10px)]
                       rounded-md
                       tracking-wide
                       cursor-pointer
                       hover:bg-[#9e3f3f]
                       transition-colors
                       text-[clamp(12px,1.3vh,16px)]">

                <svg class="size-[clamp(16px,1.8vh,20px)]">
                    <use href="./assets/icons.svg#plus-sign"></use>
                </svg>

                Nuevo proyecto

            </button>

        </div>

    </aside>

    <!-- CONTENIDO -->
    <div class="w-full
                max-w-[clamp(320px,90vh,448px)]
                px-[clamp(10px,2vh,16px)]
                flex flex-col items-center">

        <!-- Encabezado -->
        <header class="w-full py-2 flex justify-between items-center border-b border-black/10 mb-5">
            <div class="flex items-center gap-2">
                <button id="sidebar-open"
                    aria-label="Abrir menú de proyectos"
                    class="text-white/90 hover:text-white
                           cursor-pointer rounded-md p-1
                           hover:bg-white/10">

                    <svg class="size-[clamp(18px,2vh,24px)]">
                        <use href="./assets/icons.svg#menu"></use>
                    </svg>

                </button>
                <div class="flex items-center gap-1.5 font-bold text-lg tracking-tight">
                    <svg class="size-6">
                        <use href="./assets/icons.svg#logo"></use>
                    </svg>

                    <span>Hazlo</span>

                </div>

            </div>

        </header>


        <!-- TIMER -->
        <main class="w-full bg-white/10 backdrop-blur-sm rounded-lg py-2 px-4 flex flex-col items-center border border-white/5 shadow-sm">
            <div id="timer-box" class="text-8xl font-bold tracking-tight select-all mb-2 font-sans">00:00</div>
            <div id="active-activity" class="text-[26px] font-bold text-shadow-white text-center w-75" hidden>Actividad</div>
            <div id="active-project" class="text-[18px] font-bold text-gray-400 text-center mb-2 w-75" hidden>Proyecto</div>

            <div id="activity-details-div" class="relative mb-5 w-75">
                <input id="activity-details"
                    class="w-full bg-white text-lg placeholder:text-slate-400 text-slate-700 border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow"
                    placeholder="Actividad @Proyecto">
                <div id="suggestion-box"
                    class="absolute top-full left-0 right-0 bg-white border border-slate-200 rounded-md shadow-lg mt-1 z-50 hidden max-h-60 overflow-y-auto">
                </div>
            </div>

            <button id="counter"
                class="w-48 bg-white text-[#ba4949] font-bold text-xl uppercase py-3 rounded-md tracking-wider cursor-pointer hover:bg-[#9e5454] hover:text-white mb-2 flex items-center justify-center gap-2">
                <svg class="size-6"><use href="./assets/icons.svg#play"></use></svg>
                Empezar
            </button>

            <button id="stop"
                class="w-48 bg-white text-[#ba4949] font-bold text-xl uppercase py-3 rounded-md tracking-wider cursor-pointer hover:bg-[#9e5454] hover:text-white mb-2 flex items-center justify-center gap-2"
                hidden>
                <svg class="size-6"><use href="./assets/icons.svg#stop"></use></svg>
                Detener
            </button>
        </main>

        <!-- HISTORIAL -->
        <section class="w-full">
            <div id="history-section"
                class="relative flex flex-col mt-5 bg-white shadow-sm border-3 border-slate-200 rounded-lg h-95 overflow-y-auto"
                hidden>
                <div class="flex justify-around"></div>
                <div class="p-4">
                    <div id="activity-list">
                        <!-- Las actividades se añadirán aquí mediante JavaScript -->
                    </div>
                </div>
            </div>

        </section>
    </div>

    <!-- SCRIPTS -->
    <script type="module" src="./js/renderer.js"></script>
    <script type="module" src="./js/counter.js"></script>
    <script type="module" src="./js/sidebar.js"></script>

    <!--script para exportar -->
    <script type="module" src="./js/export.js"></script>

    <!-- Script para ocultar/mostrar historial -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const activityList = document.getElementById("activity-list");
            const historySection = document.getElementById("history-section");

            function actualizarHistorial() {
                if (activityList.children.length === 0) {
                    historySection.hidden = true;
                } else {
                    historySection.hidden = false;
                }
            }

            actualizarHistorial();

            const observer = new MutationObserver(() => {
                actualizarHistorial();
            });
            observer.observe(activityList, { childList: true, subtree: true });
        });
    </script>
</body>

</html>
