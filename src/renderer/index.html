<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Hazlo App</title>
</head>

<body class="min-h-full bg-[#ba4949] 
            font-sans text-white 
            flex justify-center 
            transition-colors duration-500 pb-12">
    <!-- Overlay del sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 w-72 max-w-[85vw] bg-white text-slate-800 shadow-xl z-50
               transform -translate-x-full transition-transform duration-300 ease-in-out
               flex flex-col">

        <!-- Cabecera del sidebar -->
        <div class="flex items-center justify-between px-4 py-4 border-b border-slate-200">
            <h2 class="text-lg font-bold text-slate-800">Proyectos</h2>
            <button id="sidebar-close" aria-label="Cerrar menú"
                class="text-slate-400 hover:text-slate-700 cursor-pointer rounded-md p-1 hover:bg-slate-100">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Lista de proyectos -->
        <nav class="flex-1 overflow-y-auto px-2 py-3">
            <ul id="project-list" class="space-y-1">
                <!-- Los <li> de proyectos se renderizan dinámicamente desde js/sidebar.js -->
            </ul>
        </nav>

        <!-- Nuevo proyecto -->
        <div class="px-3 py-3 border-t border-slate-200">
            <button id="new-project-btn"
                class="w-full flex items-center justify-center gap-2 bg-[#ba4949] text-white
                       font-semibold py-2.5 rounded-md tracking-wide cursor-pointer
                       hover:bg-[#9e3f3f] transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Nuevo proyecto
            </button>
        </div>
    </aside>

    <div class="w-full max-w-md px-4 flex flex-col items-center">

        <!-- Encabezado -->
        <header class="w-full py-2 flex justify-between 
                    items-center border-b border-black/10 mb-6">
            <div class="flex items-center gap-2">
                <button id="sidebar-open" aria-label="Abrir menú de proyectos"
                    class="text-white/90 hover:text-white cursor-pointer rounded-md p-1 hover:bg-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
                    </svg>
                </button>
                <div class="flex items-center gap-1.5 font-bold text-lg tracking-tight">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    <span>Hazlo</span>
                </div>
            </div>
        </header>

        <!-- Principal -->
        <main class="w-full bg-white/10 backdrop-blur-sm 
            rounded-lg py-2 px-4 flex 
            flex-col items-center border border-white/5 shadow-sm">

            <!-- Timer -->
            <div id="timer-box" class="text-8xl font-bold tracking-tight select-all mb-2 font-sans">
                00:00
            </div>
            <div id="active-activity" class="text-[26px] font-bold text-shadow-white text-center w-75" hidden>
                Actividad
            </div>
            <div id="active-project" class="text-[18px] font-bold text-gray-400 text-center mb-2 w-75" hidden>
                 Proyecto
            </div>
            <div id="activity-details-div" class="mb-6 w-75">
                <input id="activity-details" class="w-full bg-white text-lg
                    placeholder:text-slate-400 
                    text-slate-700 border 
                    border-slate-200 rounded-md px-3 
                    py-2 transition duration-300 ease 
                    focus:outline-none focus:border-slate-400 
                    hover:border-slate-300 shadow-sm focus:shadow" placeholder="Actividad @Proyecto">
            </div>
            <!-- Boton de empezar -->
            <button id="counter" class="w-48 bg-white text-[#ba4949] 
                font-bold text-xl uppercase py-3 rounded-md 
                tracking-wider cursor-pointer
                hover:bg-[#9e5454] hover:text-white mb-2 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
                </svg>
                Empezar
            </button>
            <button id="stop" class="w-48 bg-white text-[#ba4949] 
                font-bold text-xl uppercase py-3 rounded-md 
                tracking-wider cursor-pointer
                hover:bg-[#9e5454] hover:text-white mb-2 flex items-center justify-center gap-2" hidden>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M5.25 7.5A2.25 2.25 0 0 1 7.5 5.25h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25v-9Z" />
                </svg>
                Detener
            </button>
        </main>

        <section class="w-full">
            <!-- Historial de actividades -->
            <div class="relative flex flex-col my-6 bg-white shadow-sm border border-slate-200 rounded-lg ">
                <div class="p-4">

                    <div id="activity-list">
                        <div class="font-medium text-gray-800 mb-2">Hoy martes, 25 agosto 2026</div>
                        <button class="group w-full border text-slate-600 rounded-lg flex items-center justify-between py-2 px-3 hover:bg-gray-300 transition-colors">
                            <div class="flex flex-col justify-start items-start">
                                <div class="text-slate-700 font-semibold group-hover:text-slate-950">
                                    Refactorizacion
                                </div>
                                <div class="text-slate-500 text-sm">
                                    @Proyecto A
                                </div>
                            </div>
                            <div class="flex justify-center items-center gap-x-3">
                                <span class="text-slate-600 text-2xl font-medium">
                                    00:00:00
                                </span>
                                <svg class="size-8 group-hover:text-rose-500">
                                    <use href="./assets/icons.svg#reload"></use>
                                </svg>
                            </div>
                        </button>
                        
                        <div class="flex items-center justify-between p-3 last:pb-0">
                            <div class="flex items-center gap-x-3 text-gray-600">
                                <svg class="size-8">
                                    <use href="./assets/icons.svg#reload"></use>
                                </svg>
                                <div>
                                    <h6 class="text-slate-800 font-semibold">
                                        Reactorizacion @ Proyecto svg
                                    </h6>
                                    <p class="text-slate-600 text-sm">
                                        4 horas 21 min
                                    </p>
                                </div>
                            </div>
                            <h6 class="text-slate-600 font-medium">
                                $421
                            </h6>
                        </div>
                        <hr class="border-t border-gray-300 my-1">
                    </div>
                </div>
            </div>
            <div class="flex justify-around ">
                <button class="w-48 bg-white text-[#ba4949] 
                font-bold py-3  rounded-md 
                tracking-wider cursor-pointer
                hover:bg-[#9e5454] hover:text-white flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                    </svg>

                    RESUMEN
                </button>
                <button class="w-48 bg-white text-[#ba4949] 
                font-bold py-3 px-2 rounded-md 
                tracking-wider cursor-pointer
                hover:bg-[#9e5454] hover:text-white flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                    CONFIGURACION
                </button>
            </div>
        </section>

    </div>
    <script type="module" src="./js/renderer.js"></script>
    <script type="module" src="./js/counter.js"></script>
    <script type="module" src="./js/sidebar.js"></script>
    <script type="module" src="./js/historial.js"></script>
</body>

</html>
